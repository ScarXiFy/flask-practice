{% extends "base.html" %}

{% block title %}
Projects
{% endblock %}

{% block content %}

<h1>Projects</h1>

<form method="POST">
    <input
        type="text"
        name="project"
        placeholder="Enter project name">

    <button type="submit">
        Add Project
    </button>
</form>

<hr>

<ul>
{% for project in projects %}
    <li>
    <form
        action="/projects/edit/{{ project[0] }}"
        method="POST"
        style="display:inline;">

        <input
            type="text"
            name="updated_project"
            value="{{ project[1] }}">

        <button type="submit">
            Save
        </button>
    </form>

    <form
        action="/projects/delete/{{ project[0] }}"
        method="POST"
        style="display:inline;">

        <button type="submit">
            Delete
        </button>
    </form>
</li>
{% endfor %}
</ul>

{% endblock %}
