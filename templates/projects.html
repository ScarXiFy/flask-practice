{% extends "base.html" %}

{% block title %}
Projects | Flask Practice
{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h1 class="mb-4">Projects</h1>

        <form method="POST" class="mb-4">
            <div class="input-group">
                <input
                    type="text"
                    name="project"
                    class="form-control"
                    placeholder="Enter project name"
                    required>

                <button type="submit" class="btn btn-primary">
                    Add Project
                </button>
            </div>
        </form>

        {% if projects %}
            <ul class="list-group">
            {% for project in projects %}
                <li class="list-group-item">
                    <div class="d-flex gap-2">
                        <form
                            action="/projects/edit/{{ project.id }}"
                            method="POST"
                            class="d-flex gap-2 flex-grow-1">

                            <input
                                type="text"
                                name="updated_project"
                                value="{{ project.name }}"
                                class="form-control"
                                required>

                            <button type="submit" class="btn btn-warning">
                                Save
                            </button>
                        </form>

                        <form
                            action="/projects/delete/{{ project.id }}"
                            method="POST">

                            <button type="submit" class="btn btn-danger">
                                Delete
                            </button>
                        </form>
                    </div>
                </li>
            {% endfor %}
            </ul>
        {% else %}
            <div class="alert alert-info mb-0">
                No projects found. Add your first project.
            </div>
        {% endif %}

    </div>
</div>

{% endblock %}
