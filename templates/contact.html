{% extends "base.html" %}

{% block title %}
Contact
{% endblock %}

{% block content %}
<h1>Contact Form</h1>

<form method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name">

    <button type="submit">Submit</button>
</form>

{% if submitted_name %}
    <p>Hello, {{ submitted_name }}! Your form was submitted.</p>
{% endif %}

{% endblock %}
